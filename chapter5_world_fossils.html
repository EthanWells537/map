<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>第五章 | 世界化石宝库巡礼 — 石说云南</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;background:#1a1a2e}
#map{width:100vw;height:100vh}
.title-bar{position:absolute;top:0;left:0;right:0;z-index:1000;background:linear-gradient(135deg,rgba(26,26,46,.95),rgba(22,33,62,.95));color:#e0e0e0;padding:10px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #e94560;box-shadow:0 2px 20px rgba(0,0,0,.5)}
.title-bar h1{font-size:1.3em;font-weight:700}
.title-bar .subtitle{font-size:.85em;color:#a0a0b0}
.title-bar .badge{background:#e94560;color:#fff;padding:4px 12px;border-radius:20px;font-size:.8em;font-weight:600;white-space:nowrap}
.legend{position:absolute;bottom:30px;right:20px;z-index:1000;background:rgba(26,26,46,.92);color:#ddd;padding:14px 16px;border-radius:8px;font-size:.8em;min-width:200px;box-shadow:0 4px 16px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.legend h3{font-size:.95em;margin-bottom:10px;color:#e94560;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:6px}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,.5)}
.legend-heat{width:100%;height:10px;flex-shrink:0;border-radius:2px;background:linear-gradient(to right,rgba(255,0,68,.1),rgba(255,0,68,.4),rgba(255,0,68,.7),rgba(255,0,68,1))}
.legend-line{width:20px;height:2px;flex-shrink:0}
.legend-poly{width:16px;height:12px;flex-shrink:0;border:1px solid rgba(255,255,255,.5)}
.leaflet-control-scale-line{background:rgba(26,26,46,.8);color:#ddd;border-color:rgba(255,255,255,.3)}
.leaflet-control-layers{background:rgba(26,26,46,.9);color:#ddd;border:1px solid rgba(255,255,255,.15);border-radius:6px}
.leaflet-control-layers label{color:#ddd}
.fossil-popup{font-size:13px;line-height:1.6}
.fossil-popup .sp-name{font-style:italic;color:#e94560;font-weight:600}
.fossil-popup .label{color:#888}
.world-popup{font-size:13px;line-height:1.6}
.world-popup .site-name{font-weight:700;font-size:1.05em;margin-bottom:4px}
.world-popup .site-age{color:#aaa;font-size:.9em}
.world-popup .site-desc{margin-top:4px}
.city-label{background:rgba(26,26,46,.85);color:#ccc;border:none;font-size:11px;padding:2px 6px;border-radius:3px}
@media(max-width:600px){.title-bar h1{font-size:1em}.legend{bottom:10px;right:10px;font-size:.7em;padding:10px}}</style>
</head>
<body>
<div class="title-bar"><span class="badge">第五章</span><div><h1>世界化石宝库巡礼 · 对比篇</h1><div class="subtitle">全球特异埋藏化石库分布 | 云南的全球坐标</div></div></div>
<div id="map"></div>
<div class="legend"><h3>图例</h3><div class="legend-item"><span class="legend-dot" style="background:#e94560;"></span> 澄江生物群（云南）</div><div class="legend-item"><span class="legend-dot" style="background:#0fadc4;"></span> 布尔吉斯页岩（加拿大）</div><div class="legend-item"><span class="legend-dot" style="background:#8e44ad;"></span> 埃迪卡拉丘陵（澳大利亚）</div><div class="legend-item"><span class="legend-dot" style="background:#f39c12;"></span> 热河生物群（中国辽西）</div><div class="legend-item"><span class="legend-dot" style="background:#27ae60;"></span> 索伦霍芬（德国）</div><div class="legend-item"><span class="legend-dot" style="background:#e74c3c;"></span> 禄丰恐龙谷（云南）</div><div class="legend-item"><span class="legend-line" style="background:rgba(233,69,96,.5);border-top:1.5px dashed rgba(233,69,96,.5);"></span> 学术关联示意线</div><div class="legend-item" style="font-size:.75em;color:#999;margin-top:6px;">底图：高德地图 (c) AutoNavi</div></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>if(typeof L==="undefined"){document.body.innerHTML="<div style=\"color:#fff;text-align:center;padding:50px;font-size:18px\">地图加载失败<br>请检查网络连接后刷新重试</div>";}else{
var gaodeLayer=L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",{subdomains:["1","2","3","4"],attribution:"(c) 高德地图",maxZoom:18});
var map=L.map("map",{center:[25,60],zoom:3,layers:[gaodeLayer],zoomControl:true});
L.control.scale({metric:true,imperial:false,position:"bottomleft"}).addTo(map);
var sites=[{"name": "澄江生物群（云南）", "lat": 24.67, "lon": 102.92, "age": "约5.18亿年前 | 寒武纪早期", "desc": "寒武纪大爆发最完整的化石窗口，软躯体化石保存了触角、消化道等精细结构。", "color": "#e94560"}, {"name": "布尔吉斯页岩（加拿大）", "lat": 51.43, "lon": -116.48, "age": "约5.08亿年前 | 寒武纪中期", "desc": "与澄江互为补充，共同勾勒寒武纪大爆发全貌。", "color": "#0fadc4"}, {"name": "埃迪卡拉丘陵（澳大利亚）", "lat": -30.8, "lon": 138.13, "age": "约5.71–5.39亿年前 | 埃迪卡拉纪", "desc": "寒武纪大爆发前夜的静态生态系统，以软躯体多细胞生物为主。", "color": "#8e44ad"}, {"name": "热河生物群（中国辽西）", "lat": 41.6, "lon": 120.8, "age": "约1.3–1.2亿年前 | 白垩纪早期", "desc": "以带羽毛恐龙、早期鸟类化石闻名，记录了恐龙向鸟类演化的关键过渡。", "color": "#f39c12"}, {"name": "索伦霍芬（德国）", "lat": 48.89, "lon": 11.0, "age": "约1.5亿年前 | 晚侏罗世", "desc": "始祖鸟化石产地，石版印刷级灰岩保存了极致细节。", "color": "#27ae60"}, {"name": "禄丰恐龙谷（云南）", "lat": 25.15, "lon": 102.08, "age": "约2亿年前 | 早侏罗世", "desc": "许禄丰龙——中国最早被科学命名的恐龙之一。", "color": "#e74c3c"}];
sites.forEach(function(s){
  var icon=L.divIcon({className:"world-site-icon",html:'<svg width="28" height="38" viewBox="0 0 28 28"><circle cx="14" cy="10" r="9" fill="'+s.color+'" stroke="#fff" stroke-width="2.5"/><polygon points="8,36 14,24 20,36" fill="'+s.color+'" stroke="#fff" stroke-width="2"/></svg>',iconSize:[28,38],iconAnchor:[14,38],popupAnchor:[0,-38]});
  L.marker([s.lat,s.lon],{icon:icon}).bindPopup('<div class="world-popup"><div class="site-name" style="color:'+s.color+'">'+s.name+'</div><div class="site-age">'+s.age+'</div><div class="site-desc">'+s.desc+'</div></div>').addTo(map);
});
var lines=[[[24.67,102.92],[51.43,-116.48]],[[24.67,102.92],[-30.8,138.13]],[[24.67,102.92],[41.6,120.8]],[[24.67,102.92],[48.89,11]]];
lines.forEach(function(p){L.polyline(p,{color:"rgba(233,69,96,.35)",weight:1.5,dashArray:"5 8",interactive:false}).addTo(map);});
var satLayer=L.tileLayer("https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}",{subdomains:["1","2","3","4"],maxZoom:18,attribution:"(c) 高德地图"});
L.control.layers({"标准地图":gaodeLayer,"卫星影像":satLayer},null,{position:"topright",collapsed:false}).addTo(map);
}</script>
</body>
</html>
